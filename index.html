<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Image Gallery</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #0066cc;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 10px 24px rgba(0, 102, 204, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1100px;
        }

        .file-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .file-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(0, 102, 204, 0.1);
        }

        .thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover; /* Keeps aspect ratio nice without stretching */
            border-radius: 12px;
            margin-bottom: 16px;
            background-color: #f5f5f7; /* Placeholder color before image loads */
            border: 1px solid rgba(0,0,0,0.05);
        }

        .file-name {
            font-size: 0.95rem;
            font-weight: 600;
            word-break: break-all;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loader {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 40px;
        }

        .error {
            color: #ff3b30;
            grid-column: 1 / -1;
            text-align: center;
            background: #ffebe9;
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Select an image to view in full resolution</p>
    </header>

    <main class="grid" id="file-grid">
        <div class="loader">Fetching images from GitHub...</div>
    </main>

    <script>
        // --- CONFIGURATION ---
        const GITHUB_USERNAME = 'kunalthedev-11'; 
        const GITHUB_REPO = 'guesthouseapp';
        const FOLDER_PATH = ''; // Leave empty for root folder, or specify like 'assets/images'
        // ---------------------

        // Helper function to check if a file is an image
        function isImage(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const imageExts = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'];
            return imageExts.includes(ext);
        }

        async function fetchDirectory() {
            const grid = document.getElementById('file-grid');
            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to fetch repository data. Check your username and repo name.');
                
                const files = await response.json();
                grid.innerHTML = ''; // Clear loader

                let imageCount = 0;

                files.forEach(file => {
                    // Skip files that are not images (like .yml, .html, folders)
                    if (!isImage(file.name)) return;
                    
                    imageCount++;

                    const card = document.createElement('a');
                    card.className = 'file-card';
                    // Use download_url to link directly to the raw image format
                    card.href = file.download_url; 
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';

                    // Use the direct image url as the src for the thumbnail
                    card.innerHTML = `
                        <img src="${file.download_url}" alt="${file.name}" class="thumbnail" loading="lazy" />
                        <div class="file-name">${file.name}</div>
                    `;

                    grid.appendChild(card);
                });

                // Handle the case where no images are found
                if (imageCount === 0) {
                    grid.innerHTML = `<div class="loader">No image files found in this directory.</div>`;
                }

            } catch (error) {
                grid.innerHTML = `<div class="error">⚠️ ${error.message}</div>`;
            }
        }

        // Initialize fetching on page load
        fetchDirectory();
    </script>
</body>
</html>
